name: abcommerce

services:
  mongodb:
    image: mongo:8.2.9
    network_mode: host
    volumes:
      - mongodb-data:/data/db
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try {
            var s = rs.status();
            quit(s.ok === 1 && s.myState === 1 ? 0 : 1);
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
            quit(1);
          }
          '
      interval: 5s
      timeout: 5s
      retries: 60

  app:
    image: frostniost/abcommerce:1.0.8
    network_mode: host
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev,api-docs,webapp,secret-samples
      - SPRING_MONGODB_URI=mongodb://localhost:27017/abcommerce
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data: