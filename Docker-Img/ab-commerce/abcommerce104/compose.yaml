name: abcommerce

services:
  app:
    image: frostniost/abcommerce:1.0.4
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: "-Xmx512m -Xms256m"
      SPRING_PROFILES_ACTIVE: "dev,api-docs,webapp,secret-samples"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      SPRING_MONGODB_URI: "mongodb://mongodb:27017/abcommerce?replicaSet=rs0"
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8.2.9
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --eval '
          const hello = db.hello();
          if (!hello.setName) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            });
            quit(1);
          }
          quit(hello.setName === "rs0" && hello.isWritablePrimary ? 0 : 1);
          '
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  mongodb-data: