services:
  app:
    image: frostniost/abcommerce:1.0.1
    container_name: abcommerce
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev,api-docs,webapp,secret-samples
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/abcommerce?replicaSet=rs0
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - abcommerce-network

  mongodb:
    image: mongo:8.2.9
    container_name: abcommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config_data:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - abcommerce-network

networks:
  abcommerce-network:
    name: abcommerce-network
    driver: bridge

volumes:
  mongo_data:
    name: abcommerce-mongo-data
  mongo_config_data:
    name: abcommerce-mongo-config-data